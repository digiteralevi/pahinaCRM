<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PahinaCRM • Client & Operations Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eep2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0c10;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0c10;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f222e;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
  </style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white flex flex-col h-screen overflow-hidden">

  <!-- APP CONTAINER -->
  <div class="flex flex-1 h-full overflow-hidden">
    
    <!-- 1. DUAL-SIDEBAR: PRIMARY ICON RAIL -->
    <aside class="hidden md:flex flex-col items-center py-4 w-16 border-r border-white/5 bg-[#0e0f14] z-30 justify-between">
      <div class="flex flex-col items-center gap-6">
        <!-- Brand Emblem -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-indigo-400 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30 cursor-pointer">
          P
        </div>

        <!-- Primary Rail Icons -->
        <div class="flex flex-col gap-2 mt-2">
          <button onclick="switchGroup('Overview')" id="rail-Overview" class="rail-btn p-3 rounded-xl transition-all relative group text-indigo-400 bg-indigo-600/20 border border-indigo-500/30">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="absolute left-16 top-2 bg-[#181a24] text-white text-[11px] font-semibold px-2 py-1 rounded-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-white/10 shadow-xl z-50">Overview</span>
          </button>
          <button onclick="switchGroup('Workforce')" id="rail-Workforce" class="rail-btn p-3 rounded-xl transition-all relative group text-zinc-500 hover:text-zinc-200 hover:bg-white/5">
            <i data-lucide="users" class="w-5 h-5"></i>
            <span class="absolute left-16 top-2 bg-[#181a24] text-white text-[11px] font-semibold px-2 py-1 rounded-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-white/10 shadow-xl z-50">Workforce</span>
          </button>
          <button onclick="switchGroup('Financials')" id="rail-Financials" class="rail-btn p-3 rounded-xl transition-all relative group text-zinc-500 hover:text-zinc-200 hover:bg-white/5">
            <i data-lucide="wallet" class="w-5 h-5"></i>
            <span class="absolute left-16 top-2 bg-[#181a24] text-white text-[11px] font-semibold px-2 py-1 rounded-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-white/10 shadow-xl z-50">Financials</span>
          </button>
          <button onclick="switchGroup('System')" id="rail-System" class="rail-btn p-3 rounded-xl transition-all relative group text-zinc-500 hover:text-zinc-200 hover:bg-white/5">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="absolute left-16 top-2 bg-[#181a24] text-white text-[11px] font-semibold px-2 py-1 rounded-md opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-white/10 shadow-xl z-50">System</span>
          </button>
        </div>
      </div>

      <div class="flex flex-col items-center gap-3">
        <button onclick="toggleCommandModal()" class="p-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-all" title="Command Palette (Cmd+K)">
          <i data-lucide="command" class="w-5 h-5"></i>
        </button>
        <div class="w-8 h-8 rounded-full border border-white/10 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" alt="Avatar" class="w-full h-full object-cover" />
        </div>
      </div>
    </aside>

    <!-- 2. DUAL-SIDEBAR: SECONDARY CONTEXTUAL FLYOUT -->
    <aside id="sub-sidebar" class="hidden md:flex flex-col border-r border-white/5 bg-[#101218] transition-all duration-300 z-20 w-56">
      <div class="h-16 flex items-center justify-between px-4 border-b border-white/5">
        <span id="group-title" class="font-bold text-xs uppercase tracking-wider text-zinc-400">Overview Module</span>
        <button onclick="toggleSubSidebar()" class="text-zinc-500 hover:text-zinc-300 p-1">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
      </div>

      <nav id="sub-nav-container" class="p-3 space-y-1 flex-1">
        <!-- Sub-nav links dynamically rendered -->
      </nav>
    </aside>

    <!-- MAIN COMMAND CENTER BODY -->
    <div class="flex-1 flex flex-col overflow-hidden">
      
      <!-- HEADER BAR -->
      <header class="h-16 border-b border-white/5 bg-[#0b0c10]/80 backdrop-blur-md px-6 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
          <button onclick="toggleMobileMenu()" class="md:hidden p-2 bg-white/5 rounded-lg">
            <i data-lucide="menu" class="w-5 h-5 text-zinc-400"></i>
          </button>
          <button id="sub-sidebar-expand-btn" onclick="toggleSubSidebar()" class="hidden p-1.5 bg-white/5 rounded-lg text-zinc-400 hover:text-white mr-2">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
          <h1 id="page-header-title" class="text-base font-bold text-white tracking-tight">Dashboard</h1>
        </div>

        <!-- COMMAND PALETTE SEARCH TRIGGER -->
        <div class="flex items-center gap-3">
          <button onclick="toggleCommandModal()" class="hidden sm:flex items-center gap-3 bg-[#14161f] border border-white/10 rounded-xl px-3.5 py-1.5 text-xs text-zinc-400 hover:border-indigo-500/50 transition-all w-64">
            <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-500"></i>
            <span class="flex-1 text-left">Search commands...</span>
            <kbd class="bg-white/10 text-zinc-300 px-1.5 py-0.5 rounded text-[10px] font-mono">⌘K</kbd>
          </button>

          <button class="p-2 rounded-xl bg-[#14161f] border border-white/10 text-zinc-400 hover:text-white relative">
            <i data-lucide="bell" class="w-4 h-4"></i>
            <span class="w-2 h-2 rounded-full bg-rose-500 absolute top-1.5 right-1.5 ring-2 ring-[#0b0c10]"></span>
          </button>

          <button class="flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium text-xs px-4 py-2 rounded-xl shadow-lg shadow-indigo-600/20 transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span class="hidden sm:inline">New Action</span>
          </button>
        </div>
      </header>

      <!-- DYNAMIC SCROLLABLE CONTENT -->
      <main id="main-content" class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Main Content -->
      </main>
    </div>
  </div>

  <!-- COMMAND PALETTE MODAL (Cmd+K) -->
  <div id="command-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-start justify-center pt-20" onclick="toggleCommandModal()">
    <div class="w-full max-w-lg bg-[#14161f] border border-white/10 rounded-2xl shadow-2xl p-4 space-y-4" onclick="event.stopPropagation()">
      <div class="flex items-center gap-3 border-b border-white/10 pb-3">
        <i data-lucide="search" class="w-4 h-4 text-zinc-500"></i>
        <input type="text" placeholder="Type a command or module name..." class="bg-transparent text-sm text-white focus:outline-none w-full" />
        <kbd class="text-[10px] text-zinc-500 bg-white/5 px-1.5 py-0.5 rounded">ESC</kbd>
      </div>
      <div class="space-y-1">
        <div class="text-[10px] uppercase font-bold text-zinc-500 px-2 py-1">Quick Navigation</div>
        <button onclick="switchTab('Dashboard'); toggleCommandModal()" class="w-full text-left px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-indigo-600/20 hover:text-indigo-300 transition-all flex items-center justify-between">
          <span>Go to Dashboard</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-zinc-500"></i>
        </button>
        <button onclick="switchTab('Projects'); toggleCommandModal()" class="w-full text-left px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-indigo-600/20 hover:text-indigo-300 transition-all flex items-center justify-between">
          <span>Go to Projects</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-zinc-500"></i>
        </button>
        <button onclick="switchTab('Invoices'); toggleCommandModal()" class="w-full text-left px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-indigo-600/20 hover:text-indigo-300 transition-all flex items-center justify-between">
          <span>Go to Invoices</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-zinc-500"></i>
        </button>
        <button onclick="switchTab('Employees'); toggleCommandModal()" class="w-full text-left px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-indigo-600/20 hover:text-indigo-300 transition-all flex items-center justify-between">
          <span>Go to Team Directory</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-zinc-500"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- INSPECTION DRAWER PANEL FOR PROJECTS -->
  <div id="project-drawer" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-end" onclick="closeDrawer()">
    <div class="w-full max-w-md bg-[#12141c] h-full border-l border-white/10 p-6 space-y-6" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center pb-4 border-b border-white/10">
        <div>
          <span id="drawer-project-id" class="text-[10px] text-indigo-400 font-mono">P-101</span>
          <h3 id="drawer-project-name" class="text-base font-bold text-white">Project Inspection</h3>
        </div>
        <button onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5 text-zinc-400"></i></button>
      </div>
      <div class="space-y-4 text-xs">
        <div>
          <span class="text-zinc-500 block mb-1">Description</span>
          <p id="drawer-project-desc" class="text-zinc-300">Migrating infrastructure to cloud platform microservices.</p>
        </div>
        <div>
          <span class="text-zinc-500 block mb-1">Budget Allocation</span>
          <div id="drawer-project-budget" class="text-sm font-bold text-white">$88,500 of $120,000</div>
        </div>
        <button class="w-full py-2.5 bg-indigo-600 rounded-xl text-white font-semibold shadow-lg shadow-indigo-600/20">
          Launch Workstation →
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const navStructure = [
      {
        group: 'Overview',
        subItems: [
          { id: 'Dashboard', icon: 'zap' },
          { id: 'Projects', icon: 'folder' },
          { id: 'Calendar', icon: 'calendar' }
        ]
      },
      {
        group: 'Workforce',
        subItems: [
          { id: 'Employees', icon: 'users' },
          { id: 'Performance', icon: 'trending-up' },
          { id: 'Leave Management', icon: 'user-x' },
          { id: 'Recruitment', icon: 'user-plus' }
        ]
      },
      {
        group: 'Financials',
        subItems: [
          { id: 'Invoices', icon: 'file-text' },
          { id: 'Payrolls', icon: 'wallet' }
        ]
      },
      {
        group: 'System',
        subItems: [
          { id: 'Notifications', icon: 'bell' },
          { id: 'Help Center', icon: 'help-circle' },
          { id: 'Settings', icon: 'settings' }
        ]
      }
    ];

    let currentGroup = 'Overview';
    let currentTab = 'Dashboard';
    let subSidebarCollapsed = false;
    let chartInstance = null;

    window.onload = function() {
      renderSubNav();
      renderContent();
      if(typeof lucide !== 'undefined') lucide.createIcons();
    };

    function switchGroup(groupName) {
      currentGroup = groupName;
      const groupObj = navStructure.find(g => g.group === groupName);
      currentTab = groupObj.subItems[0].id;
      
      document.querySelectorAll('.rail-btn').forEach(btn => {
        btn.className = "rail-btn p-3 rounded-xl transition-all relative group text-zinc-500 hover:text-zinc-200 hover:bg-white/5";
      });
      const activeRailBtn = document.getElementById('rail-' + groupName);
      if(activeRailBtn) {
        activeRailBtn.className = "rail-btn p-3 rounded-xl transition-all relative group text-indigo-400 bg-indigo-600/20 border border-indigo-500/30";
      }

      document.getElementById('group-title').innerText = groupName + ' Module';
      renderSubNav();
      switchTab(currentTab);
    }

    function renderSubNav() {
      const container = document.getElementById('sub-nav-container');
      const groupObj = navStructure.find(g => g.group === currentGroup);
      
      container.innerHTML = groupObj.subItems.map(item => `
        <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
          currentTab === item.id 
            ? 'bg-gradient-to-r from-indigo-600/20 to-violet-600/10 text-indigo-300 border border-indigo-500/30' 
            : 'text-zinc-400 hover:text-zinc-100 hover:bg-white/5'
        }">
          <i data-lucide="${item.icon}" class="w-4 h-4 ${currentTab === item.id ? 'text-indigo-400' : 'text-zinc-500'}"></i>
          <span>${item.id}</span>
        </button>
      `).join('');

      if(typeof lucide !== 'undefined') lucide.createIcons();
    }

    function switchTab(tabId) {
      currentTab = tabId;
      document.getElementById('page-header-title').innerText = tabId;
      renderSubNav();
      renderContent();
    }

    function toggleSubSidebar() {
      const sidebar = document.getElementById('sub-sidebar');
      const expandBtn = document.getElementById('sub-sidebar-expand-btn');
      subSidebarCollapsed = !subSidebarCollapsed;
      
      if(subSidebarCollapsed) {
        sidebar.classList.add('w-0', 'opacity-0', 'overflow-hidden');
        sidebar.classList.remove('w-56');
        expandBtn.classList.remove('hidden');
      } else {
        sidebar.classList.remove('w-0', 'opacity-0', 'overflow-hidden');
        sidebar.classList.add('w-56');
        expandBtn.classList.add('hidden');
      }
    }

    function toggleCommandModal() {
      const modal = document.getElementById('command-modal');
      modal.classList.toggle('hidden');
    }

    function openDrawer(name, id, budget, desc) {
      document.getElementById('drawer-project-name').innerText = name;
      document.getElementById('drawer-project-id').innerText = id;
      document.getElementById('drawer-project-budget').innerText = budget;
      document.getElementById('drawer-project-desc').innerText = desc;
      document.getElementById('project-drawer').classList.remove('hidden');
    }
    function closeDrawer() {
      document.getElementById('project-drawer').classList.add('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        toggleCommandModal();
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        toggleSubSidebar();
      }
    });

    function renderContent() {
      const main = document.getElementById('main-content');
      
      if (currentTab === 'Dashboard') {
        main.innerHTML = `
          <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
              <div class="lg:col-span-2 bg-gradient-to-br from-indigo-950/40 via-[#12141c] to-[#12141c] border border-indigo-500/20 rounded-2xl p-6 relative overflow-hidden flex flex-col justify-between">
                <div>
                  <div class="flex items-center gap-2 text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> Pahina Builder Suite • CRM Hub
                  </div>
                  <h2 class="text-2xl font-bold text-white tracking-tight">Welcome back, Agency Lead!</h2>
                  <p class="text-xs text-zinc-400 mt-1 max-w-sm">Revenue trend up by 18.4% compared to target forecasts this quarter across all client accounts.</p>
                </div>
                <div class="flex items-center gap-4 mt-6">
                  <div>
                    <div class="text-2xl font-bold text-white">$148,200</div>
                    <div class="text-[10px] text-zinc-500 font-medium">Monthly Recurring Revenue</div>
                  </div>
                  <div class="h-8 w-px bg-white/10"></div>
                  <div>
                    <div class="text-2xl font-bold text-emerald-400">99.98%</div>
                    <div class="text-[10px] text-zinc-500 font-medium">Client Retainer SLA Score</div>
                  </div>
                </div>
              </div>

              <div class="bg-[#12141c] border border-white/5 rounded-2xl p-5 flex flex-col justify-between hover:border-white/10 transition-all">
                <div class="flex justify-between items-start">
                  <span class="text-xs font-medium text-zinc-400">Total Expense</span>
                  <span class="p-2 rounded-xl bg-rose-500/10 text-rose-400"><i data-lucide="arrow-down-right" class="w-4 h-4"></i></span>
                </div>
                <div class="mt-4">
                  <div class="text-2xl font-bold text-white">$32,450</div>
                  <div class="text-[11px] text-emerald-400 mt-1">↓ 3.1% under budget</div>
                </div>
              </div>

              <div class="bg-[#12141c] border border-white/5 rounded-2xl p-5 flex flex-col justify-between hover:border-white/10 transition-all">
                <div class="flex justify-between items-start">
                  <span class="text-xs font-medium text-zinc-400">Pending Invoices</span>
                  <span class="p-2 rounded-xl bg-amber-500/10 text-amber-400"><i data-lucide="clock" class="w-4 h-4"></i></span>
                </div>
                <div class="mt-4">
                  <div class="text-2xl font-bold text-white">$18,900</div>
                  <div class="text-[11px] text-zinc-500 mt-1">4 invoices need approval</div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2 bg-[#12141c] border border-white/5 rounded-2xl p-6 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                  <div>
                    <h3 class="text-sm font-semibold text-white">Revenue Progression</h3>
                    <p class="text-xs text-zinc-400">Monthly revenue vs forecast targets (Hover cursor for live tracking)</p>
                  </div>
                </div>
                <div class="h-64 w-full relative">
                  <canvas id="dashboardChart"></canvas>
                </div>
              </div>

              <div class="bg-[#12141c] border border-white/5 rounded-2xl p-6 flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-white">Active Sprints</h3>
                    <span class="text-[10px] text-indigo-400 font-semibold cursor-pointer" onclick="switchTab('Projects')">View All</span>
                  </div>
                  <div class="space-y-3">
                    <div onclick="openDrawer('Cloud Migration', 'P-101', '$88,500 / $120,000', 'AWS Microservices Migration')" class="p-3 bg-[#181a24] rounded-xl border border-white/5 hover:border-indigo-500/40 cursor-pointer transition-all">
                      <div class="flex justify-between items-start mb-1">
                        <span class="text-xs font-semibold text-white">Cloud Migration</span>
                        <span class="text-[10px] text-indigo-400 font-mono">74%</span>
                      </div>
                      <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-500 rounded-full" style="width: 74%"></div>
                      </div>
                    </div>

                    <div onclick="openDrawer('Mobile Client v3', 'P-102', '$42,000 / $95,000', 'React Native Mobile App')" class="p-3 bg-[#181a24] rounded-xl border border-white/5 hover:border-indigo-500/40 cursor-pointer transition-all">
                      <div class="flex justify-between items-start mb-1">
                        <span class="text-xs font-semibold text-white">Mobile Client v3</span>
                        <span class="text-[10px] text-indigo-400 font-mono">45%</span>
                      </div>
                      <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-500 rounded-full" style="width: 45%"></div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="pt-4 border-t border-white/5 text-[11px] text-zinc-500 flex justify-between items-center">
                  <span>Click project for drawer view</span>
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </div>
              </div>
            </div>
          </div>
        `;
        setTimeout(initDashboardChart, 50);
      } else if (currentTab === 'Projects') {
        main.innerHTML = `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
              <div class="bg-[#12141c] border border-white/5 rounded-xl p-4 text-xs font-bold text-zinc-200">24 Total Projects</div>
              <div class="bg-[#12141c] border border-white/5 rounded-xl p-4 text-xs font-bold text-zinc-200">14 Active</div>
              <div class="bg-[#12141c] border border-white/5 rounded-xl p-4 text-xs font-bold text-zinc-200">8 Completed</div>
              <div class="bg-[#12141c] border border-white/5 rounded-xl p-4 text-xs font-bold text-zinc-200">2 On Hold</div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div class="bg-[#12141c] border border-white/5 rounded-2xl p-5 space-y-4 hover:border-indigo-500/30 transition-all">
                <div class="flex justify-between items-start">
                  <div>
                    <h4 class="font-semibold text-white text-sm">Enterprise Cloud Migration</h4>
                    <p class="text-xs text-zinc-400 mt-1">Migrating legacy infrastructure to microservices.</p>
                  </div>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Active</span>
                </div>
                <div class="w-full h-2 bg-white/5 rounded-full overflow-hidden">
                  <div class="h-full bg-indigo-500 rounded-full" style="width: 74%"></div>
                </div>
                <div class="flex justify-between text-xs text-zinc-400 pt-2 border-t border-white/5">
                  <span>Budget: $88,500 / $120,000</span>
                  <span>Due Nov 30</span>
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        main.innerHTML = `
          <div class="bg-[#12141c] border border-white/5 rounded-2xl p-12 text-center space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto">
              <i data-lucide="layers" class="w-6 h-6"></i>
            </div>
            <h3 class="text-base font-bold text-white">Workstation: ${currentTab}</h3>
            <p class="text-xs text-zinc-400 max-w-sm mx-auto">Connected to PahinaCRM client telemetry streams. Ready for live workflow deployment.</p>
          </div>
        `;
      }

      if(typeof lucide !== 'undefined') lucide.createIcons();
    }

    function initDashboardChart() {
      const ctx = document.getElementById('dashboardChart');
      if (!ctx) return;

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
          datasets: [{
            label: 'Revenue ($)',
            data: [45000, 52000, 49000, 63000, 58000, 71000, 84000, 79000, 92000, 88000, 105000, 118000],
            borderColor: '#6366f1',
            borderWidth: 3,
            backgroundColor: 'rgba(99, 102, 241, 0.12)',
            fill: true,
            tension: 0.4,
            pointRadius: 4,
            pointHoverRadius: 7,
            pointBackgroundColor: '#6366f1',
            pointHoverBackgroundColor: '#818cf8',
            pointBorderColor: '#0b0c10',
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false,
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#14161f',
              titleColor: '#9ca3af',
              bodyColor: '#ffffff',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              padding: 12,
              displayColors: false,
              callbacks: {
                label: function(context) {
                  return 'Revenue: $' + context.parsed.y.toLocaleString();
                }
              }
            }
          },
          scales: {
            x: { 
              grid: { color: 'rgba(255,255,255,0.03)' }, 
              ticks: { color: '#71717a', font: { size: 10 } } 
            },
            y: { 
              grid: { color: 'rgba(255,255,255,0.03)' }, 
              ticks: { 
                color: '#71717a', 
                font: { size: 10 },
                callback: function(val) { return '$' + (val/1000) + 'k'; }
              } 
            }
          }
        }
      });
    }
  </script>
